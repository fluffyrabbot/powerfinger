          reason: SOP-8 package, not SOT-23-5 drop-in
        - id: MCP73831
          required_note: MCP73831 SOT-23-5 has different pinout
          reason: SOT-23-5 package exists but pinout differs
  Q1:
    function: fixture_fed_vbus_service_jumper
    description: PCB copper VBUS service jumper
    value: VBUS_SERVICE_JUMPER
    package: SOT-23 service land
    required_notes:
      - Fixture-fed VBUS now reaches TP4054 VCC directly
      - no onboard MCU-controlled charge-enable switch
      - no Q2 driver, R4 pull-up, or R6 pulldown is populated in this P0 packet
